<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Use of English – Reading Comprehension: Memory Games (B2 Abschlussprüfung · Klasse 10)">
  <title>Reading Comprehension: Memory Games · Use of English</title>
  <link rel="stylesheet" href="shared-gamification.css">
  <script src="data/topics-bundle.js" defer></script>
  <script type="module" src="modules/engine.js"></script>
  <script src="modules/standalone-runtime.js" defer></script>
</head>
<body class="gm-trainer-body" data-accent="emerald" data-default-topic="reading-memory-games">

  <div id="gm-exercise-app" class="gm-app-shell">

    <!-- 1. UNIFIED FLEX TOPBAR IN NORMAL DOCUMENT FLOW -->
    <header class="app-header gm-topbar">
      <div class="header-left gm-topbar-left">
        <a href="index.html" class="gm-brand-link" title="Zurück zur Use of English Übersicht">
          <span aria-hidden="true">←</span>
          <span>Use of English</span>
        </a>
        <div class="gm-topbar-topic-info">
          <span class="gm-grade-pill" id="gm-header-grade-pill">B2 / Abschlussklasse</span>
          <span class="gm-topbar-title" id="gm-header-topic-title">Reading Comprehension: Memory Games</span>
        </div>
      </div>

      <div class="header-right gm-topbar-right">
        <div class="gm-pill-stat is-streak" title="Tägliche Lernserie">
          <span aria-hidden="true">🔥</span>
          <span id="gm-stat-streak">0</span>
        </div>
        <div class="gm-pill-stat is-xp" title="Gesammelte Erfahrungspunkte">
          <span aria-hidden="true">⭐</span>
          <span id="gm-stat-xp">0</span>
          <span>XP</span>
        </div>
        <div class="gm-pill-stat is-level" title="Aktuelles Level">
          <span aria-hidden="true">🏆</span>
          <span id="gm-stat-level">Lvl 1</span>
        </div>
        <button type="button" class="gm-icon-btn" id="gm-header-rules-btn" title="Strategie &amp; Hinweise einblenden">
          <span aria-hidden="true">📖</span>
          <span>Strategie</span>
        </button>
        <button type="button" class="gm-icon-btn" id="gm-header-mute-btn" title="Ton umschalten" aria-label="Ton umschalten">
          🔊
        </button>
      </div>
    </header>

    <!-- LOADING INDICATOR -->
    <div id="gm-loading-state" class="gm-start-screen">
      <div class="gm-start-card" style="text-align: center;">
        <div class="gm-start-icon">📖</div>
        <h2 class="gm-start-title" style="font-size: 1.4rem;">Lade Reading Comprehension …</h2>
        <p class="gm-start-desc">Datensatz wird initialisiert.</p>
      </div>
    </div>

    <!-- 2. CENTERED TOPIC STARTSCREEN -->
    <main id="gm-start-screen" class="gm-start-screen" hidden></main>

    <!-- 3. 100dvh ACTIVE TRAINER STAGE -->
    <main id="gm-trainer-stage" class="gm-trainer-stage" hidden>
      <div class="gm-stage-subheader">
        <div class="gm-stage-subheader-top">
          <div class="gm-stage-title-group">
            <button type="button" class="gm-icon-btn" id="gm-stage-back-btn" title="Zur Themen-Übersicht">
              ← Übersicht
            </button>
            <h1 class="gm-stage-ex-title" id="gm-stage-ex-title">Reading Comprehension: Memory Games</h1>
          </div>
          <span class="gm-stage-mode-badge" id="gm-stage-mode-badge">📖 Reading Comprehension</span>
        </div>

        <div class="gm-stage-progress-row">
          <div class="gm-stage-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div class="gm-stage-progress-fill" id="gm-stage-progress-fill"></div>
          </div>
          <span class="gm-stage-progress-text" id="gm-stage-progress-text">0/11 (0%)</span>
        </div>

        <p class="gm-stage-instruction" id="gm-stage-instruction"></p>
      </div>

      <!-- Scroll-contained Workspace -->
      <section class="gm-stage-scroll" id="gm-stage-workspace" aria-live="polite"></section>
    </main>

    <!-- 4. FEEDBACK DRAWER & MOBILE-FIRST BOTTOM INPUT DOCK -->
    <div class="gm-bottom-stack">
      <aside id="gm-feedback-drawer" class="gm-feedback-drawer" aria-live="polite"></aside>
      <footer id="gm-input-dock" class="gm-input-dock" hidden></footer>
    </div>

  </div>

</body>
</html>
